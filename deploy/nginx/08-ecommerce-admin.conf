# 平台管理后台 — 挂载到 Nginx 容器内 /etc/nginx/conf.d/
# 架构：Cloudflare 隧道对外 HTTPS，源站 Nginx 仅 HTTP，无需 ssl_certificate
# 1. 修改 server_name 为隧道公网域名
# 2. 后端在宿主机、Nginx 在容器时，将 127.0.0.1 改为 host.docker.internal（端口见 backend/.env BACKEND_PORT，默认 8002）
# 3. 容器内 reload: docker exec <nginx容器> nginx -s reload

server {
    listen 80;
    listen [::]:80;
    server_name admin.wangyixiang.xyz;

    root /var/www/admin/adminDist;
    index index.html;
    access_log /var/log/nginx/ecommerce_admin_log;

    client_max_body_size 20m;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 隧道/Cloudflare 传入；Django 靠此识别 HTTPS
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    location /media/ {
        # 直读宿主机 media 目录（容器需挂载 /var/www/admin/backend/media，通常与 adminDist 同卷）
        alias /var/www/admin/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8002/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
